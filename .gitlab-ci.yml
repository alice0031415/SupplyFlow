default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  key:
    files:
      - SupplyFlow.slnx
  paths:
    - .nuget/packages/

build:
  stage: build
  script:
    - dotnet restore SupplyFlow.slnx
    - dotnet build SupplyFlow.slnx --configuration Release --no-restore

unit_tests:
  stage: test
  needs:
    - build
  script:
    - dotnet test tests/SupplyFlow.Tests/SupplyFlow.Tests.csproj
      --configuration Release
      --no-restore
      --no-build
      --filter "FullyQualifiedName~SupplyFlow.Tests.Domain.NeedTests"